# Trivy suppressions for the CI build toolkit image.
#
# This image is a *build* image. It is pulled only by the CI runner to
# execute build, lint and packaging steps; it is never deployed to a
# cluster, never serves traffic, and never runs outside CI. Every finding
# below is accepted on that basis rather than fixed individually, because
# the packages are pulled in by the upstream base image and the toolchain
# binaries it ships.
#
# Regenerate after a base-image bump: the scan job prints a fresh baseline
# when a finding is not yet listed here. Remove entries that the scan
# reports as no longer present -- stale entries fail the job.
image:
